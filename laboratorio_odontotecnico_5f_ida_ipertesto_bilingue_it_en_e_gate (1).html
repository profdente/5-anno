<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISIS Alfonso Casanova - Napoli | Laboratorio Odontotecnico 5F IdA (Esame di Stato)</title>
  <style>
    /* ==========================================================================
       DESIGN TOKENS & INSTITUTIONAL THEME (OFFLINE-FIRST, ZERO EXTERNAL DEPS)
       Palette: Navy #0f2942 | Clinical Blue #0284c7 | Teal #0d9488 | Bg #f8fafc
       ========================================================================== */
    :root {
      --navy-900: #091b2c;
      --navy-800: #0f2942;
      --navy-700: #173c61;
      --blue-600: #0284c7;
      --blue-500: #0ea5e9;
      --blue-100: #e0f2fe;
      --blue-50: #f0f9ff;
      --teal-600: #0d9488;
      --teal-100: #ccfbf1;
      --teal-50: #f0fdfa;
      --amber-600: #d97706;
      --amber-100: #fef3c7;
      --red-600: #dc2626;
      --red-100: #fee2e2;
      --purple-600: #7c3aed;
      --purple-100: #ede9fe;
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-light: #e2e8f0;
      --border-med: #cbd5e1;
      --shadow-sm: 0 1px 3px rgba(15, 41, 66, 0.08);
      --shadow-md: 0 4px 12px rgba(15, 41, 66, 0.09);
      --shadow-lg: 0 10px 25px rgba(15, 41, 66, 0.14);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ==========================================================================
       TOP INSTITUTIONAL HEADER
       ========================================================================== */
    .topbar {
      background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-800) 60%, var(--navy-700) 100%);
      color: #ffffff;
      padding: 0.75rem 1.25rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-md);
      border-bottom: 3px solid var(--teal-600);
    }

    .topbar-inner {
      max-width: 1480px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-emblem {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    .brand-subtitle {
      font-size: 0.78rem;
      color: #bae6fd;
      font-weight: 500;
    }

    .topbar-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    /* Language Segmented Control */
    .lang-group {
      display: inline-flex;
      background: rgba(9, 27, 44, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-sm);
      padding: 2px;
    }

    .lang-btn {
      background: transparent;
      color: #cbd5e1;
      border: none;
      padding: 0.4rem 0.65rem;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .lang-btn:hover {
      color: #ffffff;
    }

    .lang-btn.active {
      background: var(--blue-600);
      color: #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }

    .stat-pill {
      background: rgba(13, 148, 136, 0.25);
      border: 1px solid #2dd4bf;
      color: #ccfbf1;
      padding: 0.38rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s;
    }

    .stat-pill:hover {
      background: rgba(13, 148, 136, 0.42);
    }

    .top-action-btn {
      background: rgba(255, 255, 255, 0.11);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.24);
      padding: 0.42rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .top-action-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
    }

    .top-action-btn.primary-export {
      background: var(--teal-600);
      border-color: #2dd4bf;
    }

    .top-action-btn.primary-export:hover {
      background: #0f766e;
    }

    .mobile-menu-toggle {
      display: none;
      background: var(--blue-600);
      color: #fff;
      border: none;
      padding: 0.45rem 0.75rem;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
    }

    /* ==========================================================================
       MAIN 2-COLUMN WORKSPACE
       ========================================================================== */
    .workspace {
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      padding: 1.15rem;
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 1.25rem;
      flex: 1;
      align-items: start;
    }

    /* SIDEBAR */
    .sidebar {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 1rem;
      position: sticky;
      top: 76px;
      max-height: calc(100vh - 94px);
      overflow-y: auto;
    }

    .sidebar-progress-box {
      background: var(--blue-50);
      border: 1px solid var(--blue-100);
      border-radius: var(--radius-md);
      padding: 0.75rem;
      margin-bottom: 0.85rem;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--navy-800);
      margin-bottom: 0.4rem;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #cbd5e1;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue-600), var(--teal-600));
      width: 0%;
      transition: width 0.3s ease;
    }

    .mono-index-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--navy-800), var(--blue-600));
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 0.65rem 0.85rem;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .mono-index-btn:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .sidebar-section-label {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      padding-left: 0.25rem;
    }

    .slide-nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .slide-nav-item {
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 0.55rem 0.65rem;
      cursor: pointer;
      transition: all 0.16s ease;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 0.22rem;
    }

    .slide-nav-item:hover {
      border-color: var(--blue-500);
      background: var(--blue-50);
    }

    .slide-nav-item.active {
      border-color: var(--blue-600);
      background: var(--blue-50);
      box-shadow: inset 4px 0 0 var(--blue-600);
    }

    .slide-nav-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.35rem;
    }

    .slide-code-tag {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--navy-800);
    }

    .uda-badge {
      font-size: 0.67rem;
      font-weight: 700;
      padding: 0.12rem 0.45rem;
      border-radius: 999px;
    }

    .uda-1 { background: #e0f2fe; color: #0369a1; }
    .uda-2 { background: #ccfbf1; color: #0f766e; }
    .uda-3 { background: #ede9fe; color: #5b21b6; }
    .uda-4 { background: #fef3c7; color: #b45309; }
    .uda-5 { background: #fce7f3; color: #be185d; }

    .slide-nav-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.3;
    }

    /* ==========================================================================
       MAIN CONTENT AREA & BILINGUAL LAYOUTS
       ========================================================================== */
    .content-area {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 1.4rem;
    }

    .slide-hero {
      background: linear-gradient(135deg, #ffffff 0%, var(--blue-50) 100%);
      border-left: 5px solid var(--blue-600);
    }

    .hero-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.65rem;
    }

    .meta-chip {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      background: var(--navy-800);
      color: #ffffff;
    }

    .meta-chip.period {
      background: var(--teal-100);
      color: #0f766e;
      border: 1px solid #99f6e4;
    }

    .slide-main-title {
      font-size: 1.42rem;
      font-weight: 800;
      color: var(--navy-900);
      line-height: 1.28;
      margin-bottom: 0.35rem;
    }

    .slide-subtitle {
      font-size: 0.94rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Bilingual Grid System */
    .bi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .bi-col {
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 1rem;
    }

    .bi-col.it-col {
      border-top: 3px solid var(--teal-600);
    }

    .bi-col.en-col {
      border-top: 3px solid var(--blue-600);
    }

    .lang-flag-label {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      margin-bottom: 0.5rem;
    }

    .it-flag { background: var(--teal-50); color: #0f766e; border: 1px solid #99f6e4; }
    .en-flag { background: var(--blue-50); color: #0369a1; border: 1px solid #bae6fd; }

    .section-heading {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--navy-800);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .rich-text p {
      margin-bottom: 0.65rem;
      font-size: 0.92rem;
      color: #1e293b;
    }

    .rich-text ul {
      padding-left: 1.25rem;
      margin-bottom: 0.65rem;
    }

    .rich-text li {
      margin-bottom: 0.35rem;
      font-size: 0.91rem;
      color: #1e293b;
    }

    /* Simulator Container */
    .sim-box {
      background: linear-gradient(180deg, #f8fafc 0%, #f0f9ff 100%);
      border: 1.5px solid #bae6fd;
      border-radius: var(--radius-lg);
      padding: 1.25rem;
    }

    .sim-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid #bae6fd;
    }

    .sim-badge {
      background: var(--blue-600);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.22rem 0.6rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .sim-controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 0.85rem;
      margin-bottom: 1rem;
    }

    .control-card {
      background: #ffffff;
      border: 1px solid var(--border-med);
      border-radius: var(--radius-md);
      padding: 0.75rem;
    }

    .control-card label {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--navy-800);
      margin-bottom: 0.4rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--blue-600);
      cursor: pointer;
    }

    .sim-btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 0.85rem;
    }

    .pill-select-btn {
      background: #ffffff;
      border: 1.5px solid var(--border-med);
      color: var(--navy-800);
      padding: 0.45rem 0.8rem;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pill-select-btn:hover {
      border-color: var(--blue-600);
      background: var(--blue-50);
    }

    .pill-select-btn.active {
      background: var(--navy-800);
      color: #ffffff;
      border-color: var(--navy-800);
    }

    .svg-stage {
      background: #ffffff;
      border: 1px solid var(--border-med);
      border-radius: var(--radius-md);
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: auto;
    }

    .svg-stage svg {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 0.75rem;
      margin-top: 0.85rem;
    }

    .kpi-card {
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 0.7rem;
      text-align: center;
    }

    .kpi-label {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .kpi-value {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--navy-800);
      margin-top: 0.2rem;
    }

    /* Official Sources / ISO / EBM Box */
    .sources-box {
      background: #f0fdfa;
      border: 1px solid #99f6e4;
      border-left: 5px solid var(--teal-600);
      border-radius: var(--radius-md);
      padding: 1rem 1.2rem;
    }

    .sources-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: #0f766e;
      margin-bottom: 0.55rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .source-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .source-tag {
      background: #ffffff;
      border: 1px solid #5eead4;
      color: #115e59;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.3rem 0.65rem;
      border-radius: 8px;
    }

    /* Hypertext Monograph Links Strip */
    .mono-links-box {
      background: var(--navy-900);
      color: #ffffff;
      border-radius: var(--radius-md);
      padding: 1rem 1.2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .mono-link-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .mono-chip-btn {
      background: var(--blue-600);
      color: #ffffff;
      border: 1px solid #7dd3fc;
      padding: 0.5rem 0.9rem;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .mono-chip-btn:hover {
      background: var(--teal-600);
      border-color: #99f6e4;
      transform: translateY(-1px);
    }

    /* Bottom Slide Navigation Bar */
    .slide-footer-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 0.85rem 1.1rem;
      box-shadow: var(--shadow-sm);
    }

    .nav-arrow-btn {
      background: var(--navy-800);
      color: #ffffff;
      border: none;
      padding: 0.6rem 1.1rem;
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.16s ease;
    }

    .nav-arrow-btn:hover:not(:disabled) {
      background: var(--blue-600);
    }

    .nav-arrow-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .complete-toggle-btn {
      background: #f1f5f9;
      color: var(--navy-800);
      border: 1.5px solid var(--border-med);
      padding: 0.55rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .complete-toggle-btn.done {
      background: var(--teal-100);
      color: #0f766e;
      border-color: var(--teal-600);
    }

    /* Tables */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
      margin-top: 0.5rem;
    }

    .data-table th {
      background: var(--navy-800);
      color: #ffffff;
      text-align: left;
      padding: 0.6rem 0.75rem;
      font-weight: 700;
    }

    .data-table td {
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--border-light);
      vertical-align: top;
    }

    .data-table tr:nth-child(even) td {
      background: #f8fafc;
    }

    /* Quiz & Check Options */
    .quiz-option {
      display: block;
      width: 100%;
      text-align: left;
      background: #ffffff;
      border: 1.5px solid var(--border-med);
      border-radius: var(--radius-sm);
      padding: 0.65rem 0.9rem;
      margin-bottom: 0.45rem;
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .quiz-option:hover {
      border-color: var(--blue-600);
      background: var(--blue-50);
    }

    .quiz-option.selected {
      border-color: var(--blue-600);
      background: var(--blue-100);
      color: var(--navy-900);
    }

    .quiz-option.correct {
      border-color: var(--teal-600);
      background: var(--teal-100);
      color: #064e3b;
    }

    .quiz-option.wrong {
      border-color: var(--red-600);
      background: var(--red-100);
      color: #7f1d1d;
    }

    /* Forms & Inputs */
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border: 1.5px solid var(--border-med);
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 0.86rem;
      background: #ffffff;
      color: var(--text-main);
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--blue-600);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(9, 27, 44, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 200;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-dialog {
      background: #ffffff;
      border-radius: var(--radius-lg);
      max-width: 920px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-med);
    }

    .modal-head {
      background: var(--navy-800);
      color: #ffffff;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .modal-close-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }

                     <li><strong>Curve of Spee (1890) & Curve of Wilson (1911):</strong> the sagittal Curve of Spee (~10 cm radius) and frontal Curve of Wilson (lingual inclination of mandibular molars) compensate for <strong>Christensen's phenomenon</strong> (posterior gap during protrusion).</li>

          theoryIt: `<p>L'<strong>Articolazione Temporo-Mandibolare (ATM)</strong> consente movimenti complessi nei tre piani dello spazio (sagittale, frontale e orizzontale) grazie alla sinergia tra i muscoli elevatori (massetere, temporale, pterigoideo mediale), i muscoli depressori/protrusori (pterigoideo laterale capo inferiore e superiore, digastrico) e il complesso condilo-discale.</p>
                     <p>Sul <strong>piano sagittale</strong>, il punto interincisivo inferiore traccia l'<strong>inviluppo limite di Posselt (1952)</strong>: partendo dalla <em>Relazione Centrica (RC)</em> — posizione ortopedicamente stabile in cui i condili sono posizionati nella parte più antero-superiore delle fosse glenoidee contro il versante posteriore dell'eminenza articolare con il disco interposto — la mandibola compie una rotazione pura (asse cerniera terminale) fino a ~20–25 mm e successivamente una roto-traslazione fino alla <em>Massima Apertura (MA, ~45–55 mm)</em>. Sul <strong>piano orizzontale</strong>, i movimenti di lateralità destra e sinistra disegnano l'<strong>arco gotico di Gysi</strong>, il cui vertice corrisponde alla RC; l'angolo formato dalla traiettoria del condilo mediotrusivo (orbita/bilanciante) con il piano sagittale è l'<strong>angolo di Bennett</strong> (valore medio ~15°).</p>`,

                     <p>In the <strong>sagittal plane</strong>, the mandibular incisal point traces <strong>Posselt's border envelope (1952)</strong>: starting from <em>Centric Relation (CR)</em> — the orthopedically stable position where condyles sit in their most anterior-superior position against the posterior slope of the articular eminence with the disc properly interposed — the mandible undergoes pure hinge rotation (terminal hinge axis) up to ~20–25 mm, followed by rotation-translation to <em>Maximum Opening (MO, ~45–55 mm)</em>. In the <strong>horizontal plane</strong>, right and left laterotrusions trace the <strong>Gysi Gothic arch</strong> whose apex represents CR; the angle between the mediotrusive (non-working) condylar path and the sagittal plane is the <strong>Bennett angle</strong> (mean ~15°).</p>`,

          theoryIt: `<p>L'<strong>articolatore dentale</strong> è uno strumento meccanico (o virtuale nei software CAD) che rappresenta le articolazioni temporo-mandibolari e le arcate mascellare e mandibolare, al quale vengono fissati i modelli dei mascellari per riprodurre alcuni o tutti i movimenti mandibolari (GPT-10).</p>
                     <p>La distinzione strutturale fondamentale riguarda la geometria dei complessi condilari: negli articolatori <strong>Arcon</strong> (<em>ARticulator CONdyle</em>, es. Whip Mix, SAM, Artex CR, KaVo Protar), gli elementi condilari sono solidali alla branca inferiore e le cavità glenoidee alla branca superiore, esattamente come nel cranio umano; ciò garantisce che l'angolo tra guida condilare e piano occlusale rimanga invariato anche quando si rimuove il perno incisale o si modifica la Dimensione Verticale di Occlusione (DVO). Negli articolatori <strong>Non-Arcon</strong> (es. Hanau H2, Dentatus), le sfere condilari sono fissate alla branca superiore e scorrono in guide solidali alla branca inferiore.</p>`,

                     <p>The primary structural distinction lies in condylar housing geometry: in <strong>Arcon</strong> articulators (<em>ARticulator CONdyle</em>, e.g., Whip Mix, SAM, Artex CR, KaVo Protar), the condylar spheres are attached to the lower member and the fossae to the upper member, mirroring human anatomy; this ensures the angle between condylar guidance and the occlusal plane remains constant even when the incisal pin is removed or Vertical Dimension of Occlusion (VDO) is altered. In <strong>Non-Arcon</strong> articulators (e.g., Hanau H2, Dentatus), condylar spheres are fixed to the upper member.</p>`,

          titleEn: "Digital CAD/CAM vs Analog Workflow: EBM Evidence on Accuracy & Costs",
          theoryIt: `<p>L'integrazione tra scanner intraorali/da banco, software CAD dentali (exocad, 3Shape) e unità CAM sottrattive (fresatori a 5 assi) o additive (SLM/SLA) ha ridefinito gli standard qualitativi dell'odontotecnica moderna. La norma <strong>UNI EN ISO 12836:2015</strong> definisce i metodi di prova per valutare l'accuratezza (<em>trueness</em> = veridicità rispetto al riferimento master; <em>precision</em> = ripetibilità tra scansioni successive) dei sistemi di digitalizzazione.</p>
                     <p>Sul piano clinico-tecnico, il parametro critico di successo a lungo termine di un restauro fisso è l'<strong>adattamento marginale</strong>: valori superiori a <strong>120 µm</strong> (<em>McLean &amp; von Fraunhofer, 1971</em>) favoriscono la dissoluzione del cemento, la microinfiltrazione batterica, la carie secondaria e l'infiammazione parodontale. Le revisioni sistematiche EBM (<em>Chochlidakis et al., 2016; Papadiochou &amp; Pissiotis, 2018</em>) dimostrano che i restauri progettati e fresati via CAD/CAM presentano un gap marginale medio compreso tra <strong>35 µm e 75 µm</strong>, ampiamente al di sotto della soglia clinica dei 120 µm e caratterizzato da una deviazione standard nettamente inferiore rispetto alla fusione analogica convenzionale.</p>`,
          theoryEn: `<p>The integration of intraoral/desktop scanners, dental CAD software (exocad, 3Shape), and subtractive (5-axis milling) or additive (SLM/SLA) CAM units has redefined quality benchmarks in modern dental technology. Standard <strong>UNI EN ISO 12836:2015</strong> specifies test methods to assess the accuracy (<em>trueness</em> = closeness to reference master; <em>precision</em> = repeatability across repeated scans) of digitizing devices.</p>
                     <p>From a clinical-technical standpoint, the critical determinant of long-term fixed restoration success is <strong>marginal adaptation</strong>: gaps exceeding <strong>120 µm</strong> (<em>McLean &amp; von Fraunhofer, 1971</em>) promote cement dissolution, bacterial microleakage, secondary caries, and periodontal inflammation. EBM systematic reviews (<em>Chochlidakis et al., 2016; Papadiochou &amp; Pissiotis, 2018</em>) demonstrate that CAD/CAM milled restorations achieve mean marginal gaps between <strong>35 µm and 75 µm</strong>, well below the 120 µm clinical threshold and with markedly lower variance than conventional lost-wax casting.</p>`,
          sopIt: `<ol>
                    <li><strong>Acquisizione e Controllo Mesh (.STL / .PLY):</strong> verifica dell'integrità della linea di finitura (spalla arrotondata o chamfer profondo), assenza di sottosquadri e impostazione dello spazio cemento virtuale (cement gap 30–50 µm a 1 mm dal margine).</li>
                    <li><strong>Progettazione CAD e Articolatore Virtuale:</strong> modellazione anatomica con controllo dei punti di contatto interprossimali, spessori minimi strutturali (≥ 0,5 mm zirconia 3Y; ≥ 1,0–1,5 mm disilicato) e svincolo dinamico.</li>
                    <li><strong>Nesting CAM e Lavorazione:</strong> posizionamento strategico nel disco (nesting), calcolo dei percorsi utensile 5 assi o parametri laser SLM, rimozione dei connettori e controllo al microscopio stereoscopico.</li>
                  </ol>`,
          sopEn: `<ol>
                    <li><strong>Acquisition & Mesh Inspection (.STL / .PLY):</strong> verify finish line integrity (rounded shoulder or deep chamfer), absence of preparation undercuts, and virtual cement spacer setup (30–50 µm starting 1 mm above the margin).</li>
                    <li><strong>CAD Modeling & Virtual Articulator:</strong> anatomical design verifying interproximal contact tightness, minimum structural wall thickness (≥ 0.5 mm 3Y zirconia; ≥ 1.0–1.5 mm lithium disilicate), and dynamic excursions.</li>
                    <li><strong>CAM Nesting & Fabrication:</strong> strategic blank positioning (nesting), 5-axis toolpath calculation or SLM laser parameters, sprue/support removal, and stereomicroscope marginal inspection.</li>
                  </ol>`,
          sources: [

            { code: "Chochlidakis et al. (2016)", title: "Digital versus conventional impressions for fixed prosthodontics, J. Prosthet. Dent.", relIt: "Meta-analisi EBM sull'accuratezza marginale del flusso digitale.", relEn: "EBM meta-analysis on marginal accuracy of digital workflows." }

        {
          id: "M06",
          slideId: 5,
          uda: 2,
          titleIt: "Determinanti Statici e Dinamici dell'Occlusione (Overbite, Overjet, Spee e Wilson)",
          titleEn: "Static & Dynamic Determinants of Occlusion (Overbite, Overjet, Spee & Wilson)",
          theoryIt: `<p>La morfologia occlusale dei restauri protesici non è arbitraria, ma governata dai <strong>determinanti posteriori</strong> (inclinazione della guida condilare e movimento di Bennett, non modificabili dall'odontotecnico) e dai <strong>determinanti anteriori</strong> (Overjet, Overbite, guida incisiva e canina, modificabili nella riabilitazione protesica).</p>
                     <p>In condizioni fisiologiche, l'<strong>Overjet</strong> (2–3 mm) e l'<strong>Overbite</strong> (2–3 mm) assicurano un angolo di guida anteriore leggermente più ripido (di circa 5°–10°) rispetto all'inclinazione della guida condilare. Sul piano sagittale, la <strong>Curva di Spee (1890)</strong> — curva anatomica a concavità superiore che unisce la punta del canino inferiore alle cuspidi vestibolari dei premolari e molari — e sul piano frontale la <strong>Curva di Wilson (1911)</strong> — curva a concavità superiore determinata dall'inclinazione linguale dei molari inferiori e vestibolare dei molari superiori — armonizzano il movimento protrusivo e laterotrusivo compensando il <em>fenomeno di Christensen</em>.</p>`,
          theoryEn: `<p>Prosthetic occlusal morphology is not arbitrary; it is governed by <strong>posterior determinants</strong> (condylar guidance inclination and Bennett shift, fixed by the patient's TMJ) and <strong>anterior determinants</strong> (Overjet, Overbite, incisal and canine guidance, modifiable during prosthetic rehabilitation).</p>
                     <p>Under physiological conditions, <strong>Overjet</strong> (2–3 mm) and <strong>Overbite</strong> (2–3 mm) provide an anterior guidance angle roughly 5°–10° steeper than condylar guidance. In the sagittal plane, the <strong>Curve of Spee (1890)</strong> — an upward-concave anatomical curve connecting the mandibular canine tip to the buccal cusps of premolars and molars — and in the frontal plane, the <strong>Curve of Wilson (1911)</strong> — an upward-concave curve formed by lingual inclination of mandibular molars and buccal inclination of maxillary molars — harmonize protrusive and lateral excursions while compensating for <em>Christensen's phenomenon</em>.</p>`,
          sopIt: `<ol>
                    <li><strong>Analisi dei Rapporti Anteriori:</strong> misurazione con calibro di Overjet e Overbite sui modelli montati e impostazione del piattello incisale personalizzato.</li>
                    <li><strong>Modellazione della Curva di Spee e Wilson:</strong> utilizzo di bandierina di Broadrick o calotta sferica di Monson per verificare il corretto andamento delle curve di compensazione senza interferenze protrusive.</li>
                    <li><strong>Controllo con Cartine di Articolazione Bicolore (40 µm / 12 µm):</strong> marcatura in rosso dei contatti centrici (tripodismo o cuspide-fossa) e in blu/verde delle escursioni eccentriche per eliminare ogni precontatto lavorante o bilanciante.</li>
                  </ol>`,
          sopEn: `<ol>
                    <li><strong>Anterior Relationship Analysis:</strong> measure Overjet and Overbite with calipers on mounted casts and fabricate a custom anterior guide table.</li>
                    <li><strong>Curve of Spee & Wilson Wax-Up:</strong> use a Broadrick occlusal plane analyzer or Monson spherical template to verify proper compensating curves without protrusive interferences.</li>
                    <li><strong>Dual-Color Articulating Paper Check (40 µm / 12 µm):</strong> mark centric contacts in red (tripodism or cusp-to-fossa) and eccentric excursions in blue/green to eliminate working or non-working precontacts.</li>
                  </ol>`,
          sources: [
            { code: "Spee F.G. (1890)", title: "Die Verschiebungsbahn des Unterkiefers am Schädel, Arch. Anat. Physiol.", relIt: "Descrizione originale della curva di compensazione sagittale.", relEn: "Original description of the sagittal compensating curve." },
            { code: "Wilson G.H. (1911)", title: "A Manual of Dental Prosthetics, Lea & Febiger", relIt: "Formulazione della curva di compensazione sul piano frontale.", relEn: "Formulation of the frontal-plane compensating curve." },
            { code: "Okeson J.P. (2019)", title: "Management of Temporomandibular Disorders and Occlusion, Elsevier", relIt: "Relazione matematica tra guida condilare, guida anteriore e altezza cuspidale.", relEn: "Mathematical relationship among condylar guidance, anterior guidance, and cusp height." }
          ],

            qIt: "Su quale piano anatomico si sviluppa la Curva di Wilson?",
            qEn: "In which anatomical plane does the Curve of Wilson lie?",
            optionsIt: ["Piano frontale (coronale)", "Piano sagittale", "Piano orizzontale (trasversale)"],
            optionsEn: ["Frontal (coronal) plane", "Sagittal plane", "Horizontal (transverse) plane"],

            expEn: "Exact! The Curve of Wilson is a mediolateral curve in the frontal plane formed by the lingual inclination of mandibular molars."
          }

        {
          id: "M07",
          slideId: 6,
          uda: 3,
          titleIt: "Scienza dei Materiali Ceramici: Feldspatiche, Disilicato di Litio e Zirconia",
          titleEn: "Dental Ceramic Materials Science: Feldspathic, Lithium Disilicate & Zirconia",
          theoryIt: `<p>La norma <strong>UNI EN ISO 6872:2024</strong> suddivide i materiali ceramici dentali in 5 classi meccaniche: Classe 1 (≥ 50 MPa, ceramiche da rivestimento e faccette), Classe 2 (≥ 100 MPa, corone singole adesive), Classe 3 (≥ 300 MPa, corone singole cementate convenzionalmente e ponti fino a 3 elementi anteriori/premolari), Classe 4 (≥ 500 MPa, ponti di 3 elementi inclusi i molari) e Classe 5 (≥ 800 MPa, ponti estesi di 4 o più elementi).</p>
                     <p>Dal punto di vista microstrutturale si distinguono le <strong>vetroceramiche</strong> (ceramica feldspatica e <em>disilicato di litio Li₂Si₂O₅</em>, ~360–400 MPa, caratterizzate da cristalli aghiformi immersi in matrice vetrosa mordenzabile con HF) dalle <strong>ceramiche policristalline</strong> come l'<em>ossido di zirconia stabilizzato con ittrio (Y-TZP)</em>: la <strong>3Y-TZP</strong> (3 mol% Y₂O₃) offre elevatissima tenacità (1000–1200 MPa) grazie al meccanismo di <em>transformation toughening</em> (passaggio da fase tetragonale a monoclina con espansione volumetrica del 3–5% che blocca la propagazione delle cricche), mentre la <strong>5Y-TZP</strong> (5 mol% Y₂O₃, fase cubica prevalente) privilegia l'estetica e la traslucenza (~600–750 MPa) per settori anteriori.</p>`,
          theoryEn: `<p>Standard <strong>UNI EN ISO 6872:2024</strong> classifies dental ceramic materials into 5 mechanical classes: Class 1 (≥ 50 MPa, veneering ceramics and veneers), Class 2 (≥ 100 MPa, adhesively bonded single crowns), Class 3 (≥ 300 MPa, conventionally cemented single crowns and 3-unit bridges up to second premolar), Class 4 (≥ 500 MPa, 3-unit bridges involving molars), and Class 5 (≥ 800 MPa, 4+ unit multi-unit bridges).</p>
                     <p>Microstructurally, <strong>glass-ceramics</strong> (feldspathic porcelain and <em>lithium disilicate Li₂Si₂O₅</em>, ~360–400 MPa, featuring interlocking needle-like crystals within an HF-etchable glassy matrix) differ fundamentally from <strong>polycrystalline ceramics</strong> such as <em>yttria-stabilized tetragonal zirconia polycrystal (Y-TZP)</em>: <strong>3Y-TZP</strong> (3 mol% Y₂O₃) delivers extreme fracture resistance (1000–1200 MPa) via <em>transformation toughening</em> (tetragonal-to-monoclinic phase transformation with 3–5% volume expansion arresting crack propagation), whereas <strong>5Y-TZP</strong> (5 mol% Y₂O₃, higher cubic phase) maximizes translucency (~600–750 MPa) for anterior aesthetics.</p>`,
          sopIt: `<ol>
                    <li><strong>Lavorazione Disilicato di Litio CAD:</strong> fresatura ad umido del blocchetto allo stato metasilicato (colore blu-viola), rimozione del perno, trattamento termico di <strong>cristallizzazione in forno sottovuoto a 840°C</strong> (tempo totale ~25 min) e supercolorazione/glasura.</li>
                    <li><strong>Lavorazione Zirconia 3Y/4Y/5Y-TZP:</strong> fresatura a secco con fattore di ingrandimento calibrato sul lotto (~1,245), rifinitura dei margini allo stato verde, infiltrazione cromatica (se monostrato) e <strong>sinterizzazione a 1480°C–1530°C</strong> (ciclo standard 6–8 ore; raffreddamento lento sotto i 200°C per evitare shock termici).</li>
                    <li><strong>Preparazione Interna pre-consegna:</strong> per il disilicato applicazione protetta di gel HF 5% per 20 s (oppure indicazione all'odontoiatra); per la zirconia sabbiatura interna controllata con ossido di alluminio 50 µm a pressione ≤ 1,5 bar.</li>
                  </ol>`,
          sopEn: `<ol>
                    <li><strong>CAD Lithium Disilicate Processing:</strong> wet milling of the blue-violet metasilicate block, sprue removal, vacuum furnace <strong>crystallization firing at 840°C</strong> (~25 min total cycle), followed by staining and glazing.</li>
                    <li><strong>3Y/4Y/5Y-TZP Zirconia Processing:</strong> dry milling using the batch-specific enlargement factor (~1.245), green-state margin finishing, coloring liquid infiltration (if monochrome), and <strong>sintering at 1480°C–1530°C</strong> (standard 6–8 h cycle; slow cooling below 200°C to prevent thermal shock).</li>
                    <li><strong>Pre-Delivery Intaglio Conditioning:</strong> for lithium disilicate, controlled 5% HF gel etching for 20 s (or instructions for chairside etching); for zirconia, gentle intaglio air-abrasion with 50 µm Al₂O₃ at ≤ 1.5 bar.</li>
                  </ol>`,
          sources: [
            { code: "UNI EN ISO 6872:2024", title: "Odontoiatria - Materiali ceramici", relIt: "Classificazione in 5 classi di resistenza flessionale e requisiti chimici.", relEn: "5-class flexural strength classification and chemical solubility limits." },
            { code: "Anusavice K.J. et al. (2021)", title: "Phillips' Science of Dental Materials, 13th Ed., Elsevier", relIt: "Fisica del transformation toughening nella zirconia Y-TZP e nucleazione del disilicato.", relEn: "Physics of transformation toughening in Y-TZP zirconia and disilicate nucleation." },
            { code: "Zarone F. et al. (2019)", title: "Current status on lithium disilicate and zirconia, BMC Oral Health", relIt: "Indicazioni cliniche comparate tra disilicato e zirconia traslucente.", relEn: "Comparative clinical indications between lithium disilicate and translucent zirconia." }
          ],
          quiz: {
            qIt: "Perché la zirconia 3Y-TZP non può essere mordenzata efficacemente con Acido Fluoridrico (HF) al 5% come il disilicato di litio?",
            qEn: "Why cannot 3Y-TZP zirconia be effectively etched with 5% Hydrofluoric Acid (HF) like lithium disilicate?",
            optionsIt: ["Perché è una ceramica policristallina priva di matrice vetrosa", "Perché si scioglie completamente in 2 secondi", "Perché ha una resistenza inferiore a 50 MPa"],
            optionsEn: ["Because it is a polycrystalline ceramic devoid of a glassy matrix", "Because it dissolves completely within 2 seconds", "Because its flexural strength is below 50 MPa"],

            expEn: "Correct! Hydrofluoric acid selectively dissolves the glassy phase; zirconia is 100% polycrystalline and requires gentle 50 µm Al₂O₃ air-abrasion plus a 10-MDP primer."
          }

        {
          id: "M08",
          slideId: 7,
          uda: 3,
          titleIt: "Progettazione dello Scheletrato RPD, Parallelometro e Fusione a Cera Persa",
          titleEn: "RPD Framework Design, Dental Surveyor & Lost-Wax Casting",
          theoryIt: `<p>La <strong>Protesi Parziale Rimovibile Scheletrata (RPD)</strong> è un dispositivo biomeccanico complesso realizzato prevalentemente in <strong>lega Cromo-Cobalto-Molibdeno (Co-Cr-Mo, UNI EN ISO 22674:2022 Tipo 4/5)</strong> grazie all'elevato modulo di Young (~200–220 GPa), alla resistenza alla corrosione e alla biocompatibilità. La progettazione si fonda sull'analisi al <strong>parallelometro</strong> che individua l'asse di inserzione ottimale bilanciando i piani guida, l'estetica, la ritenzione e l'assenza di interferenze.</p>
                     <p>La realizzazione per <strong>fusione a cera persa</strong> richiede la duplicazione del modello master scaricato in rivestimento refrattario fosfatico (<strong>UNI EN ISO 15912:2016</strong>), la modellazione in cera calibrata di connettori, appoggi e ganci, l'imperniatura con camera di riserva (reservoir) e il ciclo termico di preriscaldo e fusione centrifuga o a induzione ad alta frequenza (~1380°C–1420°C) compensando il ritiro metallico (~2,0%).</p>`,
          theoryEn: `<p>The <strong>Removable Partial Denture (RPD) framework</strong> is a complex biomechanical device predominantly fabricated in <strong>Cobalt-Chromium-Molybdenum alloy (Co-Cr-Mo, UNI EN ISO 22674:2022 Type 4/5)</strong> owing to its high Young's modulus (~200–220 GPa), corrosion resistance, and biocompatibility. Design relies on <strong>dental surveyor</strong> analysis to establish an optimal path of insertion balancing guide planes, aesthetics, retention, and freedom from interference.</p>
                     <p>Fabrication via <strong>lost-wax casting</strong> involves duplicating the blocked-out master cast into a phosphate-bonded refractory investment (<strong>UNI EN ISO 15912:2016</strong>), waxing calibrated connectors, rests, and clasps, spruing with a reservoir, and executing burnout and centrifugal or high-frequency induction casting (~1380°C–1420°C) while compensating for ~2.0% alloy solidification shrinkage.</p>`,
          sopIt: `<ol>
                    <li><strong>Analisi al Parallelometro e Scarico Sottosquadri:</strong> inclinazione del modello (tilt anteriore/posteriore), tracciatura dell'equatore con mina di grafite, misurazione dei sottosquadri ritentivi (0,25 mm per Co-Cr) e scarico in cera dei sottosquadri sfavorevoli.</li>
                    <li><strong>Duplicazione e Modellazione su Modello Refrattario:</strong> duplicazione con silicone per addizione o idrocolloide reversibile, colata in rivestimento fosfatico (UNI EN ISO 15912) e applicazione dei preformati in cera (barre, ritenzioni, ganci).</li>
                    <li><strong>Imperniatura, Preriscaldo e Fusione:</strong> applicazione di perni di colata con serbatoio nel centro termico, riscaldamento progressivo fino a 1000°C e fusione a induzione della lega Co-Cr.</li>
                    <li><strong>Smuffolatura, Sabbiatura ed Elettrolucidatura:</strong> rimozione del rivestimento (con aspirazione HEPA per silice), sabbiatura con Al₂O₃ 110 µm, rifinitura con frese al carburo di tungsteno, bagno elettrolitico e lucidatura finale a specchio.</li>
                  </ol>`,
          sopEn: `<ol>
                    <li><strong>Surveying & Undercut Blockout:</strong> tilt the cast (anterior/posterior), scribe the survey line with graphite lead, measure retentive undercuts (0.25 mm for Co-Cr), and block out undesirable undercuts with wax.</li>
                    <li><strong>Duplication & Refractory Cast Wax-Up:</strong> duplicate using addition silicone or reversible hydrocolloid, pour in phosphate-bonded investment (UNI EN ISO 15912), and apply preformed wax patterns (bars, mesh retentions, clasps).</li>
                    <li><strong>Spruing, Burnout & Casting:</strong> attach sprues with a thermal-center reservoir, gradually heat to 1000°C, and induction-cast the Co-Cr alloy.</li>
                    <li><strong>Devesting, Sandblasting & Electropolishing:</strong> remove investment (under HEPA extraction for silica), sandblast with 110 µm Al₂O₃, finish with tungsten carbide burs, electropolish, and high-gloss polish.</li>
                  </ol>`,
          sources: [
            { code: "UNI EN ISO 22674:2022", title: "Odontoiatria - Materiali metallici per restauri fissi e rimovibili", relIt: "Classifica le leghe Co-Cr (Tipo 4/5) per carico di snervamento ≥ 360–500 MPa.", relEn: "Classifies Co-Cr alloys (Type 4/5) with yield strength ≥ 360–500 MPa." },
            { code: "UNI EN ISO 15912:2016", title: "Odontoiatria - Materiali per rivestimento per fusione e rivestimenti refrattari", relIt: "Definisce espansione di presa, espansione termica e resistenza a compressione.", relEn: "Defines setting expansion, thermal expansion, and compressive strength." },
            { code: "Carr & Brown (2016)", title: "McCracken's Removable Partial Prosthodontics, 13th Ed., Elsevier", relIt: "Testo di riferimento mondiale per parallelometria e progettazione RPD.", relEn: "Global gold-standard reference for surveying and RPD design." }
          ],
          quiz: {
            qIt: "Qual è la profondità di sottosquadro ritentivo standard raccomandata per un gancio circonferenziale fuso in lega Cromo-Cobalto (Co-Cr)?",
            qEn: "What is the standard recommended retentive undercut depth for a cast Cobalt-Chromium (Co-Cr) circumferential clasp?",
            optionsIt: ["0,25 mm (0.010 pollici)", "0,75 mm (0.030 pollici)", "1,50 mm (0.060 pollici)"],
            optionsEn: ["0.25 mm (0.010 inches)", "0.75 mm (0.030 inches)", "1.50 mm (0.060 inches)"],
            correct: 0,
            expIt: "Esatto! L'elevato modulo elastico delle leghe Co-Cr (~200 GPa) richiede sottosquadri ridotti pari a 0,25 mm per evitare deformazioni permanenti del gancio o traumi al dente pilastro.",
            expEn: "Exact! The high elastic modulus of Co-Cr alloys (~200 GPa) requires shallow 0.25 mm undercuts to prevent permanent clasp deformation or abutment trauma."
          }

        {
          id: "M09",
          slideId: 9,
          uda: 4,
          titleIt: "Protesi Totale Mobile e Chimica delle Resine Acriliche PMMA",
          titleEn: "Complete Removable Dentures & Acrylic Resin Chemistry (PMMA)",
          theoryIt: `<p>Nella riabilitazione dell'edentulo totale, la <strong>Protesi Totale Mobile (PTM)</strong> deve ripristinare funzione masticatoria, fonetica ed estetica del terzo inferiore del volto mantenendo l'equilibrio biomeccanico sulle mucose di supporto. La ritenzione deriva dal sottile film salivare interposto tra base protesica e mucosa (forze di adesione e coesione) sigillato lungo tutto il fornice vestibolare e nella zona del <strong>post-dam</strong> (tra palato duro e palato molle).</p>
                     <p>Le basi protesiche sono realizzate in <strong>Polimetilmetacrilato (PMMA)</strong> normato dalla <strong>UNI EN ISO 20795-1:2013</strong>, che suddivide i polimeri in Tipo 1 (termopolimerizzanti), Tipo 2 (autopolimerizzanti a freddo), Tipo 3 (termoplastici), Tipo 4 (fotopolimerizzanti) e Tipo 5 (polimerizzanti a microonde). Le resine termopolimerizzanti (Tipo 1) garantiscono resistenza a flessione ≥ 65 MPa, stabilità cromatica superiore e un contenuto di <strong>monomero residuo ≤ 2,2%</strong> (contro il limite ≤ 4,5% delle autopolimerizzanti), riducendo il rischio di citotossicità e stomatiti da protesi.</p>`,
          theoryEn: `<p>In rehabilitating the completely edentulous patient, a <strong>Complete Removable Denture (CRD)</strong> must restore masticatory function, phonetics, and lower facial aesthetics while maintaining biomechanical equilibrium on supporting tissues. Retention arises from the thin salivary film between denture base and mucosa (adhesion and cohesion forces) sealed along the vestibular border and the <strong>post-dam</strong> area (junction of hard and soft palate).</p>
                     <p>Denture bases are fabricated from <strong>Polymethyl Methacrylate (PMMA)</strong> regulated by <strong>UNI EN ISO 20795-1:2013</strong>, which classifies polymers into Type 1 (heat-cured), Type 2 (auto-polymerizing/cold-cured), Type 3 (thermoplastic), Type 4 (light-cured), and Type 5 (microwave-cured). Heat-cured resins (Type 1) ensure flexural strength ≥ 65 MPa, superior color stability, and <strong>residual monomer content ≤ 2.2%</strong> (vs ≤ 4.5% limit for cold-cured resins), minimizing cytotoxicity and denture stomatitis risks.</p>`,
          sopIt: `<ol>
                    <li><strong>Portaimpronte Individuale e Boxaggio Impronta Funzionale:</strong> realizzazione in resina fotopolimerizzante (Tipo 4) e boxaggio del modello master preservando l'ampiezza e la profondità del bordo funzionale.</li>
                    <li><strong>Costruzione Valli di Occlusione e Montaggio Denti:</strong> modellazione dei valli secondo i piani di Fox/Camper, trasferimento in articolatore e montaggio in <em>occlusione bilanciata bilaterale</em> o <em>lingualizzata</em>.</li>
                    <li><strong>Muffolatura e Polimerizzazione PMMA (UNI EN ISO 20795-1 Tipo 1):</strong> isolamento con alginato, zaffatura della resina allo stato plastico sotto pressa idraulica (100–120 bar) e ciclo termico controllato (74°C per 90' + 100°C per 30', raffreddamento lento).</li>
                    <li><strong>Rimontaggio per Controllo Occlusale (Remount) e Lucidatura:</strong> verifica degli errori di polimerizzazione in articolatore, rifinitura con frese e lucidatura con pomice fine e pasta lucidante.</li>

          titleEn: "Medical Device Regulation MDR (EU) 2017/745, D.Lgs. 137/2022, Ethics & GDPR",
          theoryIt: `<p>Il <strong>Regolamento (UE) 2017/745 (MDR)</strong>, pienamente applicabile dal 26 maggio 2021 e recepito in Italia dal <strong>D.Lgs. 5 agosto 2022, n. 137</strong>, disciplina l'immissione sul mercato dei dispositivi medici. I manufatti protesici e ortodontici realizzati in laboratorio rientrano nella definizione di <strong>Dispositivi Medici su Misura</strong> (Art. 2, punto 3 MDR): dispositivi fabbricati appositamente sulla base di una prescrizione scritta di qualsiasi persona autorizzata dal diritto nazionale (odontoiatra/medico chirurgo) che indichi caratteristiche specifiche di progettazione destinate a un singolo paziente determinato.</p>
                     <p>Pur essendo esentati dalla marcatura CE e dal codice UDI-DI, i dispositivi su misura sono soggetti agli obblighi rigorosi dell'<strong>Art. 10, Art. 15 (PRRC) e Allegato XIII MDR</strong>, nonché all'<strong>Art. 7 del D.Lgs. 137/2022</strong> (comunicazione telematica al Ministero della Salute entro 30 giorni dall'inizio attività). Sul piano deontologico resta cardinale l'<strong>Art. 11 del R.D. 1334/1928</strong> che delimita le competenze dell'odontotecnico all'esclusiva costruzione di apparecchi di protesi dentaria su modelli tratti dalle impronte fornite dal medico/odontoiatra, vietando qualsiasi manovra sul paziente.</p>`,
          theoryEn: `<p><strong>Regulation (EU) 2017/745 (MDR)</strong>, fully applicable since May 26, 2021 and harmonized in Italy via <strong>D.Lgs. August 5, 2022, no. 137</strong>, governs the placing on the market of medical devices. Prosthetic and orthodontic restorations fabricated in a dental lab qualify as <strong>Custom-Made Medical Devices</strong> (Art. 2(3) MDR): devices specifically made in accordance with a written prescription of any person authorized by national law (dentist/physician) giving specific design characteristics intended for the sole use of a particular patient.</p>
                     <p>While exempt from CE marking and UDI-DI assignment, custom-made devices are subject to the strict obligations of <strong>Art. 10, Art. 15 (PRRC), and Annex XIII MDR</strong>, as well as <strong>Art. 7 of D.Lgs. 137/2022</strong> (electronic registration with the Ministry of Health within 30 days of starting operations). Ethically, <strong>Art. 11 of R.D. 1334/1928</strong> remains foundational, confining the dental technician's scope exclusively to fabricating dental prostheses on casts poured from impressions supplied by the dentist, strictly prohibiting any clinical procedure on patients.</p>`,

          theoryIt: `<p>La riforma costituzionale introdotta con la <strong>Legge Costituzionale 11 febbraio 2022, n. 1</strong> ha inserito espressamente la tutela dell'ambiente, della biodiversità e degli ecosistemi nell'<strong>Art. 9</strong> e ha modificato l'<strong>Art. 41 della Costituzione</strong> stabilendo che l'iniziativa economica privata non può svolgersi in contrasto con l'utilità sociale o in modo da recare danno alla <em>salute, all'ambiente</em>, alla sicurezza, alla libertà e alla dignità umana. Parallelamente, l'<strong>Art. 11 Cost.</strong> consente le limitazioni di sovranità necessarie all'ordinamento europeo, rendendo direttamente vincolanti i regolamenti comunitari su sicurezza chimica (REACH/CLP), dispositivi medici (MDR) ed economia circolare.</p>

                     <p>In compliance with the <strong>Environmental Consolidation Act (D.Lgs. 152/2006)</strong>, the dental laboratory must classify its waste streams using <strong>European Waste Catalogue (EER)</strong> codes and transfer them via tracked recovery or disposal channels (Waste Identification Form - FIR and waste ledger).</p>`,

      /* --- SIMULATOR 12: FINAL GATE QUIZ (10 QUESTIONS - 80% THRESHOLD) & CERTIFICATE --- */
      function renderSim12() {
        let score = 0;
        const total = GATE_QUESTIONS.length;
        GATE_QUESTIONS.forEach(q => {
          if (state.gateAnswers[q.id] === q.correct) score++;
        });
        const pct = Math.round((score / total) * 100);
        const passed = state.gateSubmitted && pct >= 80;
        const answeredCount = Object.keys(state.gateAnswers).length;

        const certText = `ATTESTATO DI VALIDAZIONE FAD & PORTFOLIO ESAME DI STATO (5F IdA)
ISIS "Alfonso Casanova" - Napoli | Indirizzo Odontotecnico
Materia: Esercitazioni di Laboratorio Odontotecnico (Prof. Vincenzo Dente - A.S. 2026/2027)
Studente: ${state.gateStudentName}
Esito Questionario Gate Finale (UDA 1–5): ${score}/10 (${pct}% — Soglia minima 80% SUPERATA)

Data di validazione: ${new Date().toLocaleDateString("it-IT")}`;

        return `
          <div class="sim-box">
            <div class="sim-header">

            </div>

            <div class="control-card" style="margin-bottom:1rem;display:flex;flex-wrap:wrap;gap:0.75rem;align-items:center;justify-content:space-between;">

                <label style="font-size:0.78rem;font-weight:700;color:var(--navy-800);display:block;margin-bottom:0.25rem;">${t("Nominativo Studente per Attestato FAD:", "Student Full Name for FAD Certificate:")}</label>
                <input type="text" class="form-input" id="gateStudentInput" value="${state.gateStudentName.replace(/"/g, "&quot;")}" />
              </div>
              <div style="display:flex;gap:0.5rem;align-items:flex-end;">
                <button type="button" class="nav-arrow-btn" id="gateSubmitBtn">${t("Verifica & Calcola Punteggio", "Submit & Grade Quiz")}</button>
                <button type="button" class="pill-select-btn" id="gateResetBtn">${t("Azzera", "Reset")}</button>
              </div>
            </div>

            ${GATE_QUESTIONS.map((q, idx) => {
              const userAns = state.gateAnswers[q.id];
              const opts = state.lang === "en" ? q.optionsEn : state.lang === "it" ? q.optionsIt : q.optionsIt.map((o, i) => `${o} / ${q.optionsEn[i]}`);
              return `
                <div class="control-card" style="margin-bottom:0.75rem;">
                  <div style="display:flex;justify-content:space-between;gap:0.5rem;margin-bottom:0.35rem;">
                    <span class="uda-badge uda-${(idx % 5) + 1}">${q.uda}</span>
                    <span style="font-size:0.74rem;font-weight:700;color:#0f766e;">${q.ref}</span>
                  </div>
                  <p style="font-size:0.9rem;font-weight:700;color:var(--navy-900);margin-bottom:0.5rem;">${q.id}. ${t(q.qIt, q.qEn)}</p>
                  ${opts.map((optText, oIdx) => {
                    let cls = "quiz-option";
                    if (state.gateSubmitted) {
                      if (oIdx === q.correct) cls += " correct";
                      else if (userAns === oIdx) cls += " wrong";
                    } else if (userAns === oIdx) {
                      cls += " selected";
                    }
                    return `<button type="button" class="${cls}" data-gate-q="${q.id}" data-gate-opt="${oIdx}">${String.fromCharCode(65 + oIdx)}) ${optText}</button>`;
                  }).join("")}
                  ${state.gateSubmitted ? `
                    <div style="margin-top:0.4rem;padding:0.5rem 0.7rem;border-radius:8px;font-size:0.82rem;background:${userAns === q.correct ? "#f0fdfa" : "#fef2f2"};color:${userAns === q.correct ? "#0f766e" : "#991b1b"};">
                      <strong>${userAns === q.correct ? "✅" : "❌"}</strong> ${t(q.expIt, q.expEn)}
                    </div>
                  ` : ""}
                </div>
              `;
            }).join("")}

            ${state.gateSubmitted ? `
              <div class="certificate-sheet">
                <h4 style="font-size:1.1rem;font-weight:800;color:${passed ? "#0f766e" : "#dc2626"};margin-bottom:0.4rem;">
                  ${passed
                    ? t(`🎉 GATE SUPERATO: ${score}/10 (${pct}%) — Attestato FAD Validato!`, `🎉 GATE PASSED: ${score}/10 (${pct}%) — FAD Certificate Validated!`)
                    : t(`⚠️ Punteggio: ${score}/10 (${pct}%) — Soglia minima 80% (8/10) non ancora raggiunta`, `⚠️ Score: ${score}/10 (${pct}%) — Minimum 80% (8/10) threshold not yet reached`)}

                ${passed ? `
                  <pre style="background:#ffffff;border:1px solid #cbd5e1;padding:0.85rem;border-radius:8px;font-family:var(--font-mono);font-size:0.78rem;white-space:pre-wrap;margin:0.6rem 0;">${certText}</pre>
                  <div style="display:flex;flex-wrap:wrap;gap:0.5rem;" class="no-print">
                    <button type="button" class="nav-arrow-btn" id="copyCertBtn">📋 ${t("Copia Attestato", "Copy Certificate")}</button>
                    <button type="button" class="pill-select-btn" onclick="window.print()">🖨️ ${t("Stampa / Salva PDF", "Print / Save PDF")}</button>
                  </div>
                ` : `
                  <p style="font-size:0.86rem;color:#334155;">${t("Rivedi le spiegazioni normative/ISO sopra indicate e ripeti il test per sbloccare l'Attestato FAD.", "Review the normative/ISO explanations above and retake the quiz to unlock your FAD Certificate.")}</p>
                `}
              </div>
            ` : ""}
          </div>
        `;
      }

              <div class="slide-nav-top">
                <span class="slide-code-tag">${isDone ? "✅" : "○"} ${s.code}</span>

        const prevM = mIndex > 0 ? MONOGRAPHS[mIndex - 1] : null;
        const nextM = mIndex < MONOGRAPHS.length - 1 ? MONOGRAPHS[mIndex + 1] : null;

        const qOpts = state.lang === "en" ? m.quiz.optionsEn : state.lang === "it" ? m.quiz.optionsIt : m.quiz.optionsIt.map((o, i) => `${o} / ${m.quiz.optionsEn[i]}`);

            <div id="monoQuizOptions">
              ${qOpts.map((opt, idx) => `

              `).join("")}

          });
        });

      /* ----------------------------------------------------------------------

      function bindSlideEvents() {
        // Prev / Next / Complete Slide
        const prevBtn = document.getElementById("prevSlideBtn");
        const nextBtn = document.getElementById("nextSlideBtn");
        const toggleBtn = document.getElementById("toggleSlideCompleteBtn");

        if (prevBtn) {
          prevBtn.addEventListener("click", () => {
            if (state.currentSlideId > 1) {
              state.currentSlideId--;
              state.completedSlides.add(state.currentSlideId);
              renderAll();
              window.scrollTo({ top: 0, behavior: "smooth" });
            }
          });
        }
        if (nextBtn) {
          nextBtn.addEventListener("click", () => {
            if (state.currentSlideId < 12) {
              state.currentSlideId++;
              state.completedSlides.add(state.currentSlideId);
              renderAll();
              window.scrollTo({ top: 0, behavior: "smooth" });
            }
          });
        }
        if (toggleBtn) {
          toggleBtn.addEventListener("click", () => {
            if (state.completedSlides.has(state.currentSlideId)) {
              state.completedSlides.delete(state.currentSlideId);
            } else {
              state.completedSlides.add(state.currentSlideId);
            }
            renderAll();
          });
        }

        // Monograph hypertext links
        document.querySelectorAll("[data-open-mono]").forEach(btn => {
          btn.addEventListener("click", () => {
            state.currentMonoId = btn.getAttribute("data-open-mono");
            state.viewMode = "monograph";
            renderAll();
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
        });

        // Sim 1

            renderActiveSlide();
          });

        // Sim 12 (Gate Quiz)
        const nameInp = document.getElementById("gateStudentInput");
        if (nameInp) {
          nameInp.addEventListener("input", () => {

        document.querySelectorAll("[data-gate-q]").forEach(btn => {
          btn.addEventListener("click", () => {
            if (state.gateSubmitted) return;
            const qId = parseInt(btn.getAttribute("data-gate-q"), 10);
            const optIdx = parseInt(btn.getAttribute("data-gate-opt"), 10);
            state.gateAnswers[qId] = optIdx;
            renderActiveSlide();
          });
        });
        const submitGate = document.getElementById("gateSubmitBtn");
        if (submitGate) {
          submitGate.addEventListener("click", () => {
            state.gateSubmitted = true;
            state.completedSlides.add(12);
            renderAll();
          });
        }
        const resetGate = document.getElementById("gateResetBtn");
        if (resetGate) {
          resetGate.addEventListener("click", () => {
            state.gateAnswers = {};
            state.gateSubmitted = false;
            renderActiveSlide();
          });
        }
        const copyCert = document.getElementById("copyCertBtn");
        if (copyCert) {
          copyCert.addEventListener("click", () => {
            const pre = document.querySelector(".certificate-sheet pre");
            if (pre) copyToClipboard(pre.textContent);
          });
        }
      }

      function renderAll() {
        renderSidebar();
        if (state.viewMode === "slide") renderActiveSlide();
        else if (state.viewMode === "monograph") renderMonographReader();
        else renderMonographIndex();

        // Bind sidebar click items
        document.querySelectorAll("[data-nav-slide]").forEach(li => {
          li.addEventListener("click", () => {
            state.currentSlideId = parseInt(li.getAttribute("data-nav-slide"), 10);
            state.completedSlides.add(state.currentSlideId);
            state.viewMode = "slide";
            document.getElementById("sidebarPanel").classList.remove("mobile-open");
            renderAll();
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
        });
      }

      /* ----------------------------------------------------------------------
         9. MODALS & TXT STUDY GUIDE EXPORT
         ---------------------------------------------------------------------- */

        document.getElementById("modalTitle").textContent = title;
        document.getElementById("modalBody").innerHTML = bodyHtml;
        document.getElementById("modalBackdrop").classList.add("open");
      }

      function closeModal() {
        document.getElementById("modalBackdrop").classList.remove("open");
      }

      document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
      document.getElementById("modalBackdrop").addEventListener("click", e => {
        if (e.target.id === "modalBackdrop") closeModal();
      });

      document.getElementById("exportTxtBtn").addEventListener("click", () => {
        const lines = [];
        lines.push("================================================================================");
        lines.push("ISIS 'ALFONSO CASANOVA' - NAPOLI | CLASSE 5F IdA (MONOENNIO ESAME DI STATO)");
        lines.push("MATERIA: ESERCITAZIONI DI LABORATORIO ODONTOTECNICO (PROF. VINCENZO DENTE)");
        lines.push("DISPENSA DIDATTICA IPERTESTUALE BILINGUE (12 SLIDE + 12 MONOGRAFIE + FONTI ISO/EBM)");
        lines.push("================================================================================\n");

        SLIDES.forEach(s => {
          lines.push(`--------------------------------------------------------------------------------`);
          lines.push(`${s.code} [UDA ${s.uda} | ${s.periodIt} / ${s.periodEn}]`);
          lines.push(`IT: ${s.titleIt}`);
          lines.push(`EN: ${s.titleEn}`);
          lines.push(`Fonti/Sources: ${s.sources.join(" | ")}`);
          lines.push(`Monografie collegate / Linked Monographs: ${s.monographs.join(", ")}\n`);
        });

        lines.push("================================================================================");
        lines.push("SCHEDE MONOGRAFICHE DI APPROFONDIMENTO (M01 - M12)");
        lines.push("================================================================================\n");

        MONOGRAPHS.forEach(m => {
          lines.push(`[${m.id} - UDA ${m.uda} - Slide ${String(m.slideId).padStart(2, "0")}] ${m.titleIt} / ${m.titleEn}`);
          const cleanIt = m.theoryIt.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
          const cleanEn = m.theoryEn.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
          lines.push(`IT: ${cleanIt}`);
          lines.push(`EN: ${cleanEn}\n`);
        });

        const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "Dispensa_Laboratorio_Odontotecnico_5F_IdA_Casanova.txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

      document.querySelectorAll(".lang-btn").forEach(btn => {

      });

      document.getElementById("monoCounterBtn").addEventListener("click", () => {
        state.viewMode = "monoIndex";
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      document.getElementById("mobileMenuBtn").addEventListener("click", () => {
        document.getElementById("sidebarPanel").classList.toggle("mobile-open");
      });

      // Keyboard Left/Right Arrow navigation for slides
      document.addEventListener("keydown", e => {
        if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
        if (state.viewMode !== "slide") return;
        if (e.key === "ArrowRight" && state.currentSlideId < 12) {
          state.currentSlideId++;
          state.completedSlides.add(state.currentSlideId);
          renderAll();
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else if (e.key === "ArrowLeft" && state.currentSlideId > 1) {
          state.currentSlideId--;
          state.completedSlides.add(state.currentSlideId);
          renderAll();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      // Initial Boot
      renderAll();
