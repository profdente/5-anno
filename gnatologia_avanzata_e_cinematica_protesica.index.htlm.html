<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gnatologia Applicata, Arco Gotico e Articolatori</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #0284c7;
      --accent-light: #38bdf8;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app-viewport {
      width: 100%;
      max-width: 1200px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 800px;
    }

    .top-bar {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 17px;
      color: var(--accent-light);
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-grow: 1;
      max-width: 400px;
      margin: 0 32px;
    }

    .progress-bar-bg {
      flex-grow: 1;
      height: 8px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      width: 10%;
      transition: width 0.4s ease;
    }

    .progress-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      min-width: 90px;
    }

    .slide-area {
      flex: 1;
      padding: 36px 40px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .slide-header {
      margin-bottom: 20px;
    }

    .eyebrow {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent-light);
      margin-bottom: 6px;
    }

    .slide-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.25;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title i { color: var(--accent-light); }

    .card-body {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.55;
    }

    .ascii-box {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      font-family: 'Courier New', monospace;
      font-size: 12.5px;
      color: #38bdf8;
      white-space: pre-wrap;
      margin-bottom: 20px;
      line-height: 1.45;
    }

    .custom-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .custom-table th, .custom-table td {
      padding: 12px 16px;
      font-size: 13.5px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }
    .custom-table th {
      background: #090d16;
      color: var(--accent-light);
      font-family: 'Space Grotesk', sans-serif;
    }

    .quiz-gate-card {
      margin-top: auto;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid var(--accent);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.25);
    }

    .quiz-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .quiz-tag {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .quiz-question {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .quiz-options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    @media (min-width: 768px) {
      .quiz-options { grid-template-columns: 1fr 1fr; }
    }

    .option-btn {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #e2e8f0;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent-light);
      background: #1e293b;
    }

    .option-btn.correct {
      border-color: var(--success) !important;
      background: rgba(16, 185, 129, 0.2) !important;
      color: #ffffff !important;
    }

    .option-btn.wrong {
      border-color: var(--error) !important;
      background: rgba(239, 68, 68, 0.2) !important;
      color: #ffffff !important;
    }

    .quiz-feedback {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
    }

    .quiz-feedback.success-msg {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success);
      color: #6ee7b7;
    }

    .quiz-feedback.error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error);
      color: #fca5a5;
    }

    .bottom-nav {
      background: #1e293b;
      border-top: 1px solid var(--border-color);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-nav {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-nav:hover:not(:disabled) { background: #334155; }
    .btn-nav:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-next { background: var(--accent); border-color: var(--accent); }
    .btn-next:hover:not(:disabled) { background: #0369a1; }

    .summary-screen {
      text-align: center;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 500px;
    }

    .trophy-icon { font-size: 64px; color: #f59e0b; margin-bottom: 20px; }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="top-bar">
      <div class="brand">
        <i class="fa-solid fa-tooth"></i>
        <span>MODULI GNATOLOGIA & ARTICOLATORI</span>
      </div>
      <div class="progress-container">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <span class="progress-text" id="progressText">Slide 1 / 8</span>
      </div>
    </div>

    <div class="slide-area" id="slideContent">
      <!-- Content Injected via JavaScript -->
    </div>

    <div class="bottom-nav">
      <button class="btn-nav" id="btnPrev" onclick="navigateSlide(-1)" disabled>
        <i class="fa-solid fa-arrow-left"></i> Precedente
      </button>
      <button class="btn-nav btn-next" id="btnNext" onclick="navigateSlide(1)" disabled>
        Prossima Slide <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
  </div>

  <script>
    const slideData = [
      {
        id: 1,
        eyebrow: "INTRODUZIONE - FISIOLOGIA NEUROMUSCOLARE",
        title: "Dinamiche Neuromuscolari e l'Engramma di MIC",
        content: `
          <div class="grid-2">
            <div class="card" style="border-left: 4px solid var(--accent-light);">
              <div class="card-title"><i class="fa-solid fa-brain"></i> 1. Il Pilota Automatico (Engramma)</div>
              <p class="card-body">I contatti abituali in Massima Intercuspidazione (MIC) stimolano i recettori parodontali. Il sistema nervoso memorizza questo percorso coatto, costringendo i muscoli a chiudere sempre nella stessa posizione abituale, anche se condilarmente scorretta.</p>

            </div>
          </div>
          <div class="ascii-box">
[ CONTATTO POSTERIORE (MIC) ] ──> Stimolaz. Recettori ──> Memoria Muscolare (Contrazione Coatta)
[ DEPROGRAMMAZIONE (JIG) ]  ──> Disinclusione Totale ──> Spegnimento Recettori ──> Reset Muscolare (RC)

            "Aumenta la memoria neuromuscolare della MIC abituale",
            "Si spengono i recettori posteriori, interrompendo il riflesso di contrazione e resettando i muscoli",
            "I muscoli pterigoidei si contraggono con maggiore forza per trovare i contatti",
            "Si calcola automaticamente l'inclinazione condilare H"
          ],
          correct: 1,
          explanation: "Esatto! Scomparso il contatto posteriore, i recettori parodontali tacciono e il muscolo si deprogramma rilasciando la mandibola verso la Relazione Centrica."

      {
        id: 2,

        content: `
          <table class="custom-table">
            <thead>
              <tr>
                <th>Metodo di Registrazione</th>
                <th>Principio Operativo</th>
                <th>Vantaggi Clinici</th>

              <tr>
                <td><b>Jig di Lucia / Leaf Gauge</b></td>
                <td>Punto di contatto incisale anteriore singolo</td>

                <td>Protesi Fissa su denti naturali</td>
              </tr>
              <tr>
                <td><b>Manovra di Dawson</b></td>
                <td>Manipolazione bimanuale guidata dall'operatore</td>
                <td>Non richiede dispositivi; immediato</td>
                <td>Analisi occlusale diagnostica rapida</td>
              </tr>
            </tbody>
          </table>
        `,
        quiz: {
          question: "Perché l'Arco Gotico è considerato lo standard di riferimento rispetto alle cere in protesi totale rimovibile?",
          options: [
            "Perché non richiede l'uso di modelli in gesso",
            "Perché fornisce un tracciato grafico oggettivo in cui il vertice rappresenta la RC pura senza distorsioni o comprimibilità",
            "Perché aumenta automaticamente l'angolo di Bennett L",
            "Perché sostituisce integralmente l'arco facciale di trasferimento"
          ],
          correct: 1,
          explanation: "Corretto! L'Arco Gotico è un metodo grafico dove il paziente stesso identifica visivamente la RC al vertice, senza il rischio che cere o mucose comprimibili distorcano la posizione."
        }
      },
      {
        id: 3,
        eyebrow: "MODULO 1 - ANALISI GRAFICA DELL'ARCO GOTICO",
        title: "Interpretazione Diagnostica dei Tracciati dell'Arco Gotico",
        content: `
          <div class="ascii-box">
--- A. FISIOLOGICO (RC Pura) ---           --- B. PATOLOGICO (Vertice Smussato) ---
        [ Protrusione ]                           [ Deprogrammazione Incompleta ]
               ▲                                                ---
               │                                              /     \
       [ VERTICE APICALE ]                                   /       \
             /   \                                          /         \
          </div>
          <div class="grid-2">
            <div class="card" style="border-left: 4px solid var(--error);">
              <div class="card-title"><i class="fa-solid fa-circle-xmark"></i> Vertice Smussato</div>
              <p class="card-body">Indica che la deprogrammazione neuromuscolare non è terminata. Il paziente conserva memoria muscolare ed evita il punto limite antero-superiore.</p>
            </div>
            <div class="card" style="border-left: 4px solid var(--warning);">
              <div class="card-title"><i class="fa-solid fa-code-branch"></i> Bracci Asimmetrici</div>
              <p class="card-body">Evidenziano un ostacolo articolare (es. incoordinazione condilo-discale o blocco) sul lato del braccio più corto.</p>
            </div>
          </div>
        `,
        quiz: {
          question: "Cosa occorre fare se durante la registrazione con l'Arco Gotico il tracciato mostra un vertice smussato o piatto?",
          options: [
            "Procedere subito al bloccaggio delle basi con gesso rapido",

            "Modellare le cuspidi più basse sul settore molare"

            <div class="card">
              <div class="card-title"><i class="fa-solid fa-users"></i> Funzione di Gruppo</div>
              <p class="card-body"><b>MIC:</b> Solo posteriori.<br><b>Lateralità:</b> Canino + Premolari.<br><b>Vettori:</b> Distribuzione carichi su parodonto ridotto.</p>

            <div class="card">

              <p class="card-body"><b>MIC:</b> Anteriori + Posteriori.<br><b>Lateralità:</b> Contatto simultaneo sui due lati per stabilizzare la dentiera.</p>
            </div>
          </div>
        `,

          question: "Quale schema occlusale evita lo scalzamento basale della Protesi Totale durante i movimenti eccentrici?",
          options: [
            "Occlusione Mutualmente Protetta (D'Amico)",
            "Occlusione Bilanciata Bilaterale",
            "Guida Incisiva Esclusiva",
            "Funzione di Gruppo pura"
          ],
          correct: 1,
          explanation: "Esatto! L'occlusione bilanciata offre contatti simultanei lavoranti e bilancianti che mantengono stabile la dentiera."
        }

      {
        id: 5,
        eyebrow: "MODULO 3 - CINEMATICA E REGISTRAZIONI",

            <div class="card">

          </div>

            "Permettere l'inclinazione delle scatole condilari dell'articolatore leggendo la traiettoria H in gradi",

            <div class="card" style="border-left: 4px solid var(--error);">
              <div class="card-title"><i class="fa-solid fa-circle-question"></i> Quesito 2: Errore su L</div>
              <p class="card-body">Impostare l'Angolo di Bennett $L$ a $0^\circ$ genera gravi interferenze sui versanti cuspidali durante la masticazione sul lato lavorante/bilanciante.</p>
            </div>
          </div>
        `,
        quiz: {
          question: "Come influisce una traiettoria condilare H piatta (es. 15°) sul disegno delle cuspidi dei molari protesici?",
          options: [
            "Impone di modellare cuspidi piatte o basse per consentire la disinclusione",
            "Permette di creare cuspidi estremamente alte ed appuntite",
            "Annulla completamente la necessità dell'angolo di Bennett",
            "Rende obbligatoria l'occlusione mutualmente protetta"
          ],
          correct: 0,
          explanation: "Eccellente! Con una traiettoria condilare piatta la mandibola scende poco durante l'avanzamento, rendendo necessario modellare cuspidi basse per evitare interferenze."
        }
      }
    ];

    let currentSlideIndex = 0;
    let unlockedSlideIndex = 0;
    let userAnswers = new Array(slideData.length).fill(null);
    let quizPassed = new Array(slideData.length).fill(false);

    const slideContent = document.getElementById('slideContent');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');

    function init() {
      renderSlide(currentSlideIndex);
    }

    function renderSlide(index) {
      if (index >= slideData.length) {
        renderSummaryScreen();
        return;
      }

      const data = slideData[index];
      const percent = ((index + 1) / slideData.length) * 100;
      progressFill.style.width = percent + '%';
      progressText.innerText = `Slide ${index + 1} / ${slideData.length}`;

      let html = `
        <div class="slide-header">
          <p class="eyebrow">${data.eyebrow}</p>
          <h1 class="slide-title">${data.title}</h1>
        </div>
        ${data.content}
        
        <div class="quiz-gate-card">
          <div class="quiz-header">
            <span class="quiz-tag"><i class="fa-solid fa-lock"></i> Quiz Gate Obbligatorio</span>
          </div>
          <div class="quiz-question">${data.quiz.question}</div>
          <div class="quiz-options">
      `;

      data.quiz.options.forEach((opt, optIdx) => {
        let btnClass = 'option-btn';
        if (userAnswers[index] === optIdx) {
          btnClass += quizPassed[index] ? ' correct' : ' wrong';
        } else if (quizPassed[index] && optIdx === data.quiz.correct) {
          btnClass += ' correct';
        }

        html += `
          <button class="${btnClass}" 
                  onclick="selectOption(${index}, ${optIdx})" 
                  ${quizPassed[index] ? 'disabled' : ''}>
            <i class="fa-regular ${userAnswers[index] === optIdx ? (quizPassed[index] ? 'fa-circle-check' : 'fa-circle-xmark') : 'fa-circle'}"></i>
            ${opt}
          </button>
        `;
      });

      html += `</div>`;

      if (userAnswers[index] !== null) {
        if (quizPassed[index]) {
          html += `
            <div class="quiz-feedback success-msg">
              <i class="fa-solid fa-circle-check"></i> <b>Risposta Corretta!</b> ${data.quiz.explanation}
            </div>
          `;
        } else {
          html += `
            <div class="quiz-feedback error-msg">
              <i class="fa-solid fa-triangle-exclamation"></i> <b>Risposta Errata.</b> Rileggi attentamente la slide e seleziona l'opzione corretta per sbloccare la navigazione!
            </div>
          `;
        }
      }

      html += `</div>`;

      slideContent.innerHTML = html;
      btnPrev.disabled = index === 0;
      btnNext.disabled = !quizPassed[index];
    }

    function selectOption(slideIdx, optionIdx) {
      if (quizPassed[slideIdx]) return;

      const data = slideData[slideIdx];
      userAnswers[slideIdx] = optionIdx;

      if (optionIdx === data.quiz.correct) {
        quizPassed[slideIdx] = true;
        if (slideIdx > unlockedSlideIndex) {
          unlockedSlideIndex = slideIdx;
        }
      } else {
        quizPassed[slideIdx] = false;
      }

      renderSlide(slideIdx);
    }

    function navigateSlide(direction) {
      currentSlideIndex += direction;
      if (currentSlideIndex < 0) currentSlideIndex = 0;
      renderSlide(currentSlideIndex);
    }

    function renderSummaryScreen() {
      progressFill.style.width = '100%';
      progressText.innerText = 'Completato';
      btnPrev.disabled = false;
      btnNext.disabled = true;

      slideContent.innerHTML = `
        <div class="summary-screen">
          <i class="fa-solid fa-trophy trophy-icon"></i>
          <h1 class="slide-title" style="font-size:32px; margin-bottom:12px;">Corso e Scheda completati!</h1>
          <p class="card-body" style="font-size:16px; max-width:620px; margin-bottom:24px;">
            Hai completato tutti e 8 i Quiz Gate dei Moduli Didattici e della Scheda Pratica di Laboratorio.
          </p>
          <button class="btn-nav btn-next" onclick="restartCourse()" style="font-size:15px; padding:14px 28px;">
            <i class="fa-solid fa-rotate-right"></i> Riavvia il Percorso Interattivo
          </button>
        </div>
      `;
    }

    function restartCourse() {
      currentSlideIndex = 0;
      unlockedSlideIndex = 0;
      userAnswers.fill(null);
      quizPassed.fill(false);
      renderSlide(0);
    }

    window.onload = init;
  </script>

</body>
</html>
